# Example per-tag Bugzilla components. Copy to `tags.yaml` in your data directory
# (gitignored here, as a deployment keeps its own) and edit to suit.
#
# Keyed by whiteboard tag. `--mode check` counts the bugs in these components, to
# show how many carry the tag. `Product::*` matches every component in a product.
fp:
  components:
    - Core::Gecko Profiler
    - "DevTools::Performance Tools (Profiler/Timeline)"
    - "Firefox Profiler::*"

fxp:
  components:
    - Testing::AWSY
    - Testing::mozperftest
    - Testing::Performance
    - Testing::Raptor
    - Testing::Talos
    - Testing::Condprofile
    - Tree Management::Perfherder
    - Tree Management::Treeherder
    - "Tree Management::Treeherder: API"
    - "Tree Management::Treeherder: Frontend"
    - Core::Gecko Profiler
    - "DevTools::Performance Tools (Profiler/Timeline)"

fxpe:
  components:
    - "Core::Performance Engineering"

pcf:
  components:
    - Testing::PerfCompare

sp3:
  components: []
